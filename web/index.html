<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>Juntos · free video calls</title>
<meta name="description" content="Free video calls for everyone. No account, no time limit, nothing to install. Open source.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/img/icon-192.png">
<link rel="apple-touch-icon" href="/img/icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- Start / join -->
<section id="home" class="page">
  <div class="home">
    <img src="/img/icon-192.png" alt="" class="logo">
    <h1>Juntos</h1>
    <p class="lead">Free video calls for everyone.<br>No account, no time limit.</p>
    <button id="start" class="primary big">Start a call</button>
    <details id="startOpts" class="startOpts"><summary>Who can join</summary></details>
    <button id="schedule" class="secondary">Schedule for later</button>
    <form id="joinForm" class="join">
      <input id="joinCode" placeholder="Enter a code or link" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="secondary">Join</button>
    </form>
    <button id="install" class="secondary" hidden>Install app</button>
    <div id="upcoming" class="upcoming" hidden></div>
    <p class="small">Open source · <a href="https://github.com/kleiders3010/juntos">github.com/kleiders3010/juntos</a> · <a href="/privacy">Privacy</a> · <a href="#" id="feedbackHome">Send feedback</a></p>
  </div>
</section>

<!-- Check camera and mic before going in -->
<section id="lobby" class="page" hidden>
  <div class="lobby">
    <div class="preview">
      <video id="previewVideo" autoplay playsinline muted></video>
      <div id="previewOff" class="off" hidden>Camera is off</div>
      <div class="previewBar">
        <button id="pMic" class="round" title="Microphone"></button>
        <button id="pCam" class="round" title="Camera"></button>
        <button id="pBg" class="round" title="Background"></button>
        <button id="pDev" class="round" title="Devices"></button>
      </div>
    </div>
    <div class="lobbySide">
      <h2 id="lobbyCode" class="lobbyCode"></h2>
      <input id="name" placeholder="Your name" maxlength="60" autocomplete="name">
      <input id="passcode" placeholder="Passcode" maxlength="10" autocomplete="off" autocapitalize="off" spellcheck="false" hidden>
      <button id="enter" class="primary big">Join now</button>
      <button id="enterComp" class="linkBtn" title="A second device in the same room: no microphone or sound, so no echo">Companion mode (no sound)</button>
      <div id="lobbyDevs" class="lobbyDevs">
        <div class="ldRow" data-k="mic"><span class="ldIc"></span><select id="ldMic" aria-label="Microphone"></select><div id="pMeter" class="meter"><i></i></div></div>
        <div class="ldRow" data-k="spk"><span class="ldIc"></span><select id="ldSpk" aria-label="Speaker"></select><button id="ldTest" class="chip">Test</button></div>
        <div class="ldRow" data-k="cam"><span class="ldIc"></span><select id="ldCam" aria-label="Camera"></select></div>
      </div>
      <p id="lobbyOk" class="devOk" hidden><i></i><span></span></p>
      <p id="lobbyMsg" class="small"></p>
      <button id="pCheck" class="linkBtn">More sound and video checks</button>
    </div>
  </div>
</section>

<!-- The call -->
<section id="call" class="page" hidden>
  <header class="top">
    <span id="roomCode" class="code"></span>
    <button id="invite" class="chip">Invite people</button>
    <span id="compBox" class="compBox" hidden><span>Companion mode</span><button id="compOff" class="chip">Use my audio</button></span>
    <span id="netState" class="netState" hidden></span>
    <span id="recDot" class="rec" hidden>● Recording</span>
  </header>
  <main class="stage">
    <div id="grid" class="grid"></div>
    <aside id="panel" class="panel" hidden>
      <div class="panelHead"><h3 id="panelTitle"></h3><button id="boardMax" class="icon" hidden></button><button id="panelClose" class="icon" title="Close">✕</button></div>
      <div id="chatPane" class="pane">
        <div id="chatPins" class="chatPins" hidden></div>
        <div id="chatLog" class="chatLog"></div>
        <div id="chatQuote" class="chatQuote" hidden><span></span><button id="chatQuoteX" type="button" title="Cancel reply">✕</button></div>
        <form id="chatForm" class="chatForm"><input id="chatText" placeholder="Send a message" autocomplete="off"><button class="primary">Send</button></form>
      </div>
      <div id="boardPane" class="pane">
        <div class="boardTools" id="boardTools"></div>
        <div class="boardWrap"><canvas id="boardCanvas" class="boardCanvas"></canvas><div id="boardZoom" class="boardZoom"></div></div>
      </div>
      <div id="bgPane" class="pane"><div id="bgChoices" class="bgChoices"></div></div>
      <div id="peoplePane" class="pane"><ul id="peopleList" class="people"></ul></div>
      <div id="actPane" class="pane actPane"></div>
      <div id="brPane" class="pane actPane brPane"></div>
      <div id="notesPane" class="pane notesPane"></div>
    </aside>
  </main>
  <div id="captions" class="captions" aria-live="polite" hidden></div>
  <nav class="bar" id="bar"></nav>
  <div id="reactions" class="reactions" hidden></div>
</section>

<section id="ended" class="page" hidden>
  <div class="home">
    <h1 id="endedTitle">You left the call</h1>
    <p id="endedMsg" class="endedMsg"></p>
    <button id="rejoin" class="primary big">Rejoin</button>
    <button id="endedCaps" class="secondary" hidden>Save captions (.txt)</button>
    <button id="endedAct" class="secondary" hidden>Save polls and questions (.txt)</button>
    <button id="endedNotes" class="secondary" hidden>Save notes (.txt)</button>
    <button id="endedAtt" class="secondary" hidden>Save attendance (.csv)</button>
    <button id="homeBtn" class="secondary">Back to start</button>
    <button id="endedFeedback" class="ghost">Report a problem or idea</button>
  </div>
</section>

<div id="toasts" class="toasts"></div>
<div id="mutedNote" class="mutedNote" role="status" hidden></div>
<div id="pttNote" class="pttNote" role="status" hidden></div>
<input id="bgFile" type="file" accept="image/*" hidden>
<script type="module" src="/app.js"></script>
</body>
</html>
