# Juntos: the web app (static files) and its signaling (one Durable Object per room), one Worker.
# Free plan: SQLite-backed Durable Objects, static assets.
name = "juntos-signal"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [
  { pattern = "meet.jurisgames.com", custom_domain = true },
  { pattern = "signal.jurisgames.com", custom_domain = true },
]

[assets]
directory = "../web"
not_found_handling = "single-page-application"
run_worker_first = ["/ws/*", "/info/*", "/health", "/turn"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# new links and lobby questions: 300 per address per minute in each Cloudflare location (index.js; safety round 2, J7)
[[ratelimits]]
name = "JOINS"
namespace_id = "2102"
simple = { limit = 300, period = 60 }
